name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The database half of the secrecy guarantee.
  #
  # `npm test` proves the UI does not render a reservation to the owner. This
  # job proves the server will not send one — which is the half that actually
  # holds, since a UI test passes just as happily when the secret is sitting in
  # the client's memory waiting to be read out of the network tab.
  #
  # This must stay a REQUIRED check. Schema exposure is a dashboard toggle,
  # outside version control, and the kind of thing that gets flipped during an
  # incident and never flipped back.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql and pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client postgresql-16-pgtap

      - name: Install pgTAP into the service container
        # The extension files ship with the client package on the runner, but
        # the server runs in the service container, so copy them across.
        run: |
          CID=$(docker ps --filter ancestor=pgvector/pgvector:pg16 --format '{{.ID}}')
          docker cp /usr/share/postgresql/16/extension/. "$CID:/usr/share/postgresql/16/extension/"
          psql -c 'create extension if not exists pgtap;'

      - name: Stub the Supabase-provided auth schema
        # Supabase supplies auth.users and auth.uid(); a bare Postgres does not.
        # The stub mirrors their contract so the migrations run unmodified.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb
          );
          create role anon;
          create role authenticated;
          create role service_role;
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claims', true)::jsonb->>'sub','')::uuid; $$;
          create function auth.role() returns text language sql stable as $$
            select coalesce(current_setting('request.jwt.claims', true)::jsonb->>'role','anon'); $$;
          SQL

      - name: Apply migrations
        # pg_cron is provided by Supabase and is not installable here; it is the
        # only statement this job cannot exercise.
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- $f"
            sed 's/^\(create extension if not exists pg_cron.*\)/-- CI-SKIP: \1/' "$f" \
              | psql -v ON_ERROR_STOP=1 -q
          done

      - name: Seed
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - name: Schema tests
        run: psql -Xv ON_ERROR_STOP=1 -f supabase/tests/0001_schema.test.sql | tee /tmp/schema.tap
      - name: Fail on any schema failure
        run: '! grep -q "^not ok" /tmp/schema.tap'

      - name: Secrecy tests
        run: psql -Xv ON_ERROR_STOP=1 -f supabase/tests/0002_secrecy.test.sql | tee /tmp/secrecy.tap
      - name: Fail on any secrecy failure
        run: '! grep -q "^not ok" /tmp/secrecy.tap'

      # A suite that silently stopped running would otherwise look identical to
      # a suite that passed.
      - name: Assert both suites actually ran
        run: |
          test "$(grep -c '^ok ' /tmp/schema.tap)"  -ge 75
          test "$(grep -c '^ok ' /tmp/secrecy.tap)" -ge 36

  # The single worst mistake available in a Supabase app is shipping the
  # service_role key to the browser: it bypasses RLS entirely.
  bundle-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: No service_role key in the built bundle
        run: |
          if grep -rEl 'service_role|SUPABASE_SERVICE' dist/ 2>/dev/null; then
            echo "::error::A service_role reference reached the client bundle."
            exit 1
          fi
